# Cloudflare Workers (static assets) config for the 3D portfolio
# Deploy with:  npx wrangler deploy
# The [build] step runs `vite build` automatically before uploading ./dist.
# Docs: https://developers.cloudflare.com/workers/static-assets/

name = "pro2"
compatibility_date = "2026-08-20"

[build]
command = "npm run build"

[assets]
directory = "./dist"
